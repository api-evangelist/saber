aid: saber
name: Saber
description: >-
  Saber is a decentralized automated market maker (AMM) on the Solana blockchain,
  optimized for trading and providing liquidity between mean-reverting assets such as
  stablecoins and wrapped or pegged tokens. Its StableSwap program delivers low-slippage
  swaps and capital-efficient liquidity pools. Saber does not expose a REST/HTTP API;
  developers integrate through its on-chain StableSwap program using first-party
  TypeScript SDKs (the @saberhq/* packages on npm) and Rust crates (crates.io) that
  construct and submit Solana transactions. The project also maintains open-source
  Solana tooling, an asset/pool registry, and on-chain governance. Saber was surfaced
  as a portfolio company of Multicoin Capital.
